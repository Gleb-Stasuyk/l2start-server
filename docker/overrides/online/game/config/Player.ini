# Profile "online": keys applied on top of stock dist/game/config/Player.ini inside the container (Gleb, KT3).
# Drops from ordinary mobs go straight into the inventory (players and bots). Herbs and raid/boss drops stay
# stock (picked up by hand): AutoLootHerbs = False, AutoLootRaids = False. Full inventory: drops fall to the ground.
AutoLoot = True
# No newbie guide: no tutorial quest (Q255) on create/enter, no tutorial pop-ups (question marks, voice, HTML).
# Side effect (stock): the Newbie Helper NPCs no longer hand out the tutorial rewards (novice shots, tokens).
DisableTutorial = True
