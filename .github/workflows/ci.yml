name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Run the docker compose smoke test (starts db, login, game)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  ANT_VERSION: "1.10.15"
  ANT_SHA512: "d78427aff207592c024ff1552dc04f7b57065a195c42d398fcffe7a0145e8d00cd46786f5aa52e77ab0fdf81334f065eb8011eecd2b48f7228e97ff4cb20d16c"

jobs:
  build:
    name: Ant build (JDK 27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
      - name: Cache Ant
        id: ant-cache
        uses: actions/cache@v4
        with:
          path: ~/ant
          key: ant-${{ env.ANT_VERSION }}
      - name: Install Ant
        if: steps.ant-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ant.tgz "https://archive.apache.org/dist/ant/binaries/apache-ant-${ANT_VERSION}-bin.tar.gz"
          echo "${ANT_SHA512}  /tmp/ant.tgz" | sha512sum -c -
          mkdir -p ~/ant && tar xzf /tmp/ant.tgz -C ~/ant --strip-components=1
      - name: Build jars
        run: |
          java -version
          ~/ant/bin/ant -version
          ~/ant/bin/ant -noinput -f core/build.xml jar
          ls -l build/dist/libs/
      - uses: actions/upload-artifact@v4
        with:
          name: server-jars
          path: |
            build/dist/libs/LoginServer.jar
            build/dist/libs/GameServer.jar
          retention-days: 7

  verify-core:
    name: core/ = upstream Mobius
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Vendor import is byte-identical to upstream.lock
        run: bash tools/verify-upstream.sh
      - name: core/ changes are only marked platform hooks
        run: bash tools/check-hooks.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f docker/Dockerfile -t l2start-server:dev .
      - name: Smoke test (manual run only)
        if: github.event_name == 'workflow_dispatch' && inputs.smoke
        working-directory: docker
        run: |
          docker compose --env-file profiles/solo.env up -d --no-build || true
          for i in $(seq 1 90); do
            st=$(docker inspect -f '{{.State.Health.Status}}' l2s-game 2>/dev/null || echo none)
            echo "game: $st"; [ "$st" = healthy ] && break; sleep 10
          done
          docker logs --tail 40 l2s-login; docker logs --tail 60 l2s-game
          [ "$(docker inspect -f '{{.State.Health.Status}}' l2s-game)" = healthy ]
      - name: Smoke cleanup
        if: always() && github.event_name == 'workflow_dispatch' && inputs.smoke
        working-directory: docker
        run: docker compose --env-file profiles/solo.env down -v || true
