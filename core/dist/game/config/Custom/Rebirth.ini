# ---------------------------------------------------------------------------
# Rebirth System
# ---------------------------------------------------------------------------
# This module enables a controlled rebirth progression system for players.
#
# Main behavior:
# - Allows a character to perform rebirth after reaching the configured level.
# - Supports a limited number of rebirths per character.
# - Grants configurable rewards after each successful rebirth.
# - Allows players to acquire a limited number of rebirth-related skills.
# - Can optionally wipe most learned skills during rebirth, while preserving
#   protected skill groups and manually whitelisted skills.
# - Can optionally restore temporary runtime skills after the wipe/rebuild phase.
# - Can optionally apply rebirth skills to subclasses.
#
# Functional flow:
# 1. The player reaches the minimum required level.
# 2. The system checks item cost and rebirth limits.
# 3. The rebirth process is executed.
# 4. Optional skill cleanup/restoration is applied depending on configuration.
# 5. Reward, visual effects, personal message, and global announcement are sent.
#
# Important notes:
# - RebirthDeleteAllSkills is a sensitive option and should only be enabled
#   when the protected groups and whitelist have been reviewed carefully.
# - This chronicle documents support for STARTING_CLASS, FISHING, NOBLE,
#   CLAN, and HERO, but only the groups explicitly listed in the property
#   below are active.
# - Skill availability, reward values, item costs, and broadcast behavior are
#   fully configurable below.
# ---------------------------------------------------------------------------

# Enables or disables the rebirth system.
RebirthAllow = false

# Minimum character level required to request rebirth.
RebirthMin = 75

# Maximum number of rebirths a player can perform.
RebirthMaxCount = 3

# Maximum number of rebirth skills a player can own simultaneously.
RebirthMaxSelectedSkills = 3

# ---------------------------------------------------------------------------
# Rebirth Skill Inheritance / Skill Wipe
# ---------------------------------------------------------------------------

# If true, rebirth skills are also applied to subclasses.
# If false, rebirth skills are applied only to the main class.
RebirthInheritSkillsToSubclasses = true

# If true, all player skills are removed during rebirth except protected
# groups and explicitly whitelisted skills.
# Use with caution.
RebirthDeleteAllSkills = true

# Comma-separated list of skill IDs that must never be removed during rebirth.
# Example: 1216,1405,1414
RebirthSkillDeleteWhitelist =

# Skill groups protected from deletion during rebirth.
# Supported in Interlude: STARTING_CLASS, FISHING, NOBLE, CLAN, HERO
RebirthDeleteProtectedSkillGroups = STARTING_CLASS,FISHING,NOBLE,CLAN,HERO

# If true, temporary runtime skills are restored after the wipe/rebuild phase.
RebirthDeleteRestoreTemporarySkills = true

# ---------------------------------------------------------------------------
# Rebirth Costs
# ---------------------------------------------------------------------------

# Item ID and amount required to perform rebirth.
RebirthItemId = 57
RebirthItemAmount = 1000000

# ---------------------------------------------------------------------------
# Rebirth Reward
# ---------------------------------------------------------------------------

# Reward granted after each successful rebirth.
RebirthRewardItemId = 1232
RebirthRewardItemAmount = 10

# ---------------------------------------------------------------------------
# Rebirth Skill Reset
# ---------------------------------------------------------------------------

# Refund mode when resetting a rebirth skill.
# Available options: FULL, MID, NONE
RebirthSkillRefundMode = MID

# ---------------------------------------------------------------------------
# Rebirth Skill Pools
# ---------------------------------------------------------------------------

# Available rebirth skills for mage classes.
# Format: skillId,skillLevel,itemCost
RebirthMageSkills = 1059,1,6;1085,1,6;1204,1,6;1087,1,6;1013,1,6;1303,1,6

# Available rebirth skills for fighter classes.
# Format: skillId,skillLevel,itemCost
RebirthFighterSkills = 1086,1,6;1077,1,6;1013,1,6;1240,1,6;1035,1,6;1068,1,6

# ---------------------------------------------------------------------------
# Rebirth Completion Effects
# ---------------------------------------------------------------------------

# Animation triggered when rebirth is completed.
# Format: social action + skill animation + skill level
RebirthFinishSocialId = 7
RebirthFinishEffectSkillId = 2024
RebirthFinishEffectSkillLevel = 1

# Animation triggered when a rebirth skill is acquired.
# Format: social action + skill animation + skill level
RebirthSelectSocialId = 3
RebirthSelectEffectSkillId = 2024
RebirthSelectEffectSkillLevel = 1

# ---------------------------------------------------------------------------
# Personal Screen Message
# ---------------------------------------------------------------------------

# Screen message shown only to the player after a successful rebirth.
# Available placeholders: %player%, %rebirth_count%, %max_rebirth%
RebirthScreenMessageEnabled = true
RebirthScreenMessage = Congratulations %player%! Rebirth status acquired.
RebirthScreenMessagePosition = TOP_CENTER
RebirthScreenMessageTime = 5000

# ---------------------------------------------------------------------------
# Global Announcement
# ---------------------------------------------------------------------------

# Global announcement sent to the entire server after a successful rebirth.
# Available placeholders: %player%, %rebirth_count%, %max_rebirth%
RebirthGlobalAnnouncementEnabled = true
RebirthGlobalAnnouncement = Congratulations %player% has reached Rebirth.
RebirthGlobalAnnouncementCritical = false