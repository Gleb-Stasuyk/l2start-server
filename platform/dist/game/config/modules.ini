# ---------------------------------------------------------------------------
# Which modules are on: <module id> = on | off
# Without a key the module's "defaultEnabled" for the profile (module.json) is used.
# Keys at the top apply to every profile; [solo] / [online] sections override them.
# Local changes: config/modules.local.ini (docker/overrides/<profile>/game/config/), or env L2_MODULE_<ID>=on|off.
# Module settings: config/modules/<id>.ini (keys from the module's module.json "config").
# ---------------------------------------------------------------------------

# Example:
#   bots-core = on
#   [online]
#   bots-core = off
