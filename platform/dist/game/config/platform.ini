# ---------------------------------------------------------------------------
# l2start module platform settings (docs/MODULES.md)
# Keys at the top apply to every profile; [solo] / [online] sections override them.
# Profile = env L2_PROFILE (docker: L2S_PROFILE), default solo.
# Local changes: config/platform.local.ini (same format, docker/overrides/<profile>/game/config/),
# or env L2_PLATFORM__<KEY> (e.g. L2_PLATFORM__DISABLEALL=true).
# ---------------------------------------------------------------------------

# Module folders, comma separated, relative to the game folder.
ModuleRoots = modules

# What to do when an enabled module fails validation, dependencies, SQL migration, loading or onEnable/onServerReady:
#   continue - start without the broken module (and the modules that depend on it), log the reason
#   abort    - refuse to start the server (the log says which module and why)
FailurePolicy = continue

# Runtime circuit breaker: this many errors of one module within the window switch the module off until restart.
BreakerErrors = 20
BreakerWindow = 60s

# Warn when a single call into module code (listener, command, task) takes longer than this.
SlowCall = 100ms

# Max time for onShutdown of one module.
ShutdownTimeout = 10s

# Language of module messages when multilanguage support is off (en, ru).
DefaultLanguage = ru

# true = load no modules at all (behaves exactly like the stock server).
DisableAll = false

[solo]
FailurePolicy = continue

[online]
FailurePolicy = abort
